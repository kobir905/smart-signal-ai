<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Signal AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
      padding: 20px 15px;
      margin: 0;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: #151c30;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    select {
      background: #222b45;
      color: white;
    }

    button {
      background: #16a34a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .signal-box {
      margin-top: 25px;
      padding: 20px;
      background: #0f172a;
      border-radius: 15px;
    }

    #signal {
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0;
    }

    #confidence {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .analysis {
      background: #151c30;
      padding: 15px;
      border-radius: 12px;
      text-align: left;
    }

    .analysis h3 {
      text-align: center;
      margin-top: 0;
    }

    .analysis p {
      color: #ddd;
      margin: 12px 0;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      font-size: 13px;
    }

    .note {
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🤖 Smart Signal AI</h1>

    <p class="subtitle">
      Binary Technical Analysis
    </p>

    <select id="pair">
      <option value="EUR/USD">💱 EUR/USD</option>
      <option value="GBP/USD">💱 GBP/USD</option>
      <option value="USD/JPY">💱 USD/JPY</option>
    </select>

    <select id="timeframe">
      <option value="1 Minute">⏱️ 1 Minute</option>
      <option value="5 Minutes">⏱️ 5 Minutes</option>
    </select>

    <button onclick="generateSignal()">
      🔄 GENERATE SIGNAL
    </button>

    <div class="signal-box">

      <div id="signal">
        WAIT 🟡
      </div>

      <div id="confidence">
        Confidence: 50%
      </div>

      <div class="analysis">

        <h3>🧠 Technical Analysis</h3>

        <p id="trend">
          📈 Trend: Waiting...
        </p>

        <p id="momentum">
          📊 Momentum: Waiting...
        </p>

        <p id="direction">
          🔎 Market Direction: Waiting...
        </p>

        <p id="strength">
          ⚡ Signal Strength: Waiting...
        </p>

      </div>

      <div class="status" id="status">
        Analysis engine ready
      </div>

    </div>

    <p class="note">
      Educational/demo analysis. Signals are not guaranteed.
    </p>

  </div>

  <script>

    function generateSignal() {

      /*
        Technical Analysis Engine

        score:
        + = bullish
        - = bearish
        0 = neutral

        এই ভার্সনে market data simulated।
        পরের ধাপে Live API data এখানে যুক্ত হবে।
      */

      const trendScore =
        Math.floor(Math.random() * 101) - 50;

      const momentumScore =
        Math.floor(Math.random() * 101) - 50;

      const totalScore =
        trendScore + momentumScore;

      let signal;
      let confidence;
      let trend;
      let momentum;
      let direction;
      let strength;

      // Trend analysis
      if (trendScore > 15) {
        trend = "Bullish 📈";
      } else if (trendScore < -15) {
        trend = "Bearish 📉";
      } else {
        trend = "Sideways ↔️";
      }

      // Momentum analysis
      if (momentumScore > 15) {
        momentum = "Positive 🟢";
      } else if (momentumScore < -15) {
        momentum = "Negative 🔴";
      } else {
        momentum = "Neutral 🟡";
      }

      // Final signal
      if (totalScore >= 30) {

        signal = "CALL 🟢";
        confidence =
          Math.min(95, 65 + Math.abs(totalScore));

        direction = "Up 📈";
        strength = "Strong";

      } else if (totalScore <= -30) {

        signal = "PUT 🔴";
        confidence =
          Math.min(95, 65 + Math.abs(totalScore));

        direction = "Down 📉";
        strength = "Strong";

      } else {

        signal = "WAIT 🟡";
        confidence = 60;

        direction = "Unclear ↔️";
        strength = "Medium";

      }

      // Pair and timeframe
      const pair =
        document.getElementById("pair").value;

      const timeframe =
        document.getElementById("timeframe").value;

      // Update screen
      document.getElementById("signal").innerText =
        signal;

      document.getElementById("confidence").innerText =
        "Confidence: " + confidence + "%";

      document.getElementById("trend").innerText =
        "📈 Trend: " + trend;

      document.getElementById("momentum").innerText =
        "📊 Momentum: " + momentum;

      document.getElementById("direction").innerText =
        "🔎 " + pair +
        " Direction: " + direction;

      document.getElementById("strength").innerText =
        "⚡ Signal Strength: " +
        strength +
        " | " +
        timeframe;

      document.getElementById("status").innerText =
        "Analysis completed for " +
        pair +
        " • " +
        timeframe;

    }

  </script>

</body>
</html>
